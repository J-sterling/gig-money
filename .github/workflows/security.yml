# Security scanning, adapted from my homelab security pipeline (SAST, SCA, DAST).
# SAST and SCA run on every push and pull request; results go to the repo's
# Security tab. DAST is a passive OWASP ZAP baseline scan of the live demo,
# weekly and by hand: it only follows links (GET), so it never drafts with the
# model, creates sandbox orders or calls the PayPal webhook.
name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "47 7 * * 1"   # Mondays 07:47 UTC: the DAST scan
  workflow_dispatch:
    inputs:
      dast:
        description: "Also run the DAST scan against the live demo"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sast-sca:
    name: SAST (Semgrep) and SCA (Trivy)
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Semgrep (JavaScript, Node and secrets rules)
        run: |
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:1.183.0 \
            semgrep scan --config p/javascript --config p/nodejs --config p/secrets \
            --metrics=off --exclude node_modules --sarif --output semgrep.sarif --error

      - name: Trivy (dependencies and config, high and critical)
        if: always()
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25  # v0.36.0
        with:
          scan-type: fs
          scanners: vuln,misconfig
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: sarif
          output: trivy.sarif
          limit-severities-for-sarif: true

      - name: Upload Semgrep results
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066  # v4
        with: { sarif_file: semgrep.sarif, category: semgrep }

      - name: Upload Trivy results
        if: always() && hashFiles('trivy.sarif') != ''
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066  # v4
        with: { sarif_file: trivy.sarif, category: trivy }

  dast:
    name: DAST (OWASP ZAP baseline, passive)
    if: github.event_name == 'schedule' || inputs.dast
    runs-on: ubuntu-latest
    env:
      DEMO_URL: ${{ vars.DEMO_URL }}
      DEMO_PASSWORD: ${{ secrets.DEMO_PASSWORD }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      # The demo is behind a password; ZAP sends it as a Basic-auth header.
      - name: Demo password as a header
        run: |
          : "${DEMO_URL:?Set the DEMO_URL repo variable}"
          auth=$(printf 'zap:%s' "$DEMO_PASSWORD" | base64 -w0)
          echo "::add-mask::$auth"
          echo "ZAP_AUTH=$auth" >> "$GITHUB_ENV"

      - name: ZAP baseline scan
        uses: zaproxy/action-baseline@de8ad967d3548d44ef623df22cf95c3b0baf8b25  # v0.15.0
        with:
          target: ${{ env.DEMO_URL }}
          rules_file_name: .zap/rules.tsv
          allow_issue_writing: false
          fail_action: true
          artifact_name: zap-baseline-report
          cmd_options: >-
            -m 1 -z "-config replacer.full_list(0).description=demo-auth
            -config replacer.full_list(0).enabled=true
            -config replacer.full_list(0).matchtype=REQ_HEADER
            -config replacer.full_list(0).matchstr=Authorization
            -config replacer.full_list(0).regex=false
            -config replacer.full_list(0).replacement=Basic\ ${{ env.ZAP_AUTH }}"
